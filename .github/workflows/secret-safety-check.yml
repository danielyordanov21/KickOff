name: Secret Safety Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  scan:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Run tracked-file secret safety check
        shell: pwsh
        run: ./scripts/check-no-secrets.ps1
